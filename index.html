<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 1. nhat token url ngay lap tuc
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');

        if (tokenFromUrl) {
            localStorage.setItem("userToken", tokenFromUrl);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 2. kiem tra xem co ve khong
        if (!localStorage.getItem("userToken")) {
            alert("Bạn chưa đăng nhập! Vui lòng quay lại trang Login.");
            window.location.href = "https://haduyminh5a1.github.io/Frontend/pages/login2.html"; 
        }
    </script>
</head>
<body>
    <h1>BATTLESHIP GAME</h1>
    <button id="btn-logout" style="position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #c0392b;">
    ĐĂNG XUẤT
    </button>
    <div id="start-modal" class="modal-overlay" style="display: flex;">
        <div class="modal-content">
            <h2 id="start-title">BATTLESHIP COMMAND</h2>
            <p>Select your engagement mode:</p>
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
                <button id="btn-single-player" class="start-game-btn">VS A.I</button>
                <button id="btn-local-pvp" class="start-game-btn" style="background: #e74c3c; box-shadow: 0 8px 0px #c0392b;">LOCAL PVP</button>
            </div>
        </div>
    </div>

    <div id="fog-of-war-modal" class="modal-overlay" style="display: none; z-index: 200; backdrop-filter: blur(15px);">
        <div class="modal-content" style="background: rgba(255, 255, 255, 0.9);">
            <h2 id="fog-title" style="font-size: 2.5rem; color: #e74c3c;">PLAYER 2'S TURN</h2>
            <p>Please pass the device to your opponent. No peeking!</p>
            <button id="btn-ready" class="start-game-btn" style="margin-top: 20px;">I'M READY</button>
        </div>
    </div>

    <div id="main-game-area" style="display: none;">
        
        <div class="top-info">
            <div class="difficulty-group">
                <label for="difficulty-select">Difficulty:</label>
                <select id="difficulty-select">
                    <option value="easy">Easy (Random)</option>
                    <option value="hard" selected>Hard (AI Hunter)</option>
                </select>
            </div>
            <p id="status-text">Status: Preparing fleet...</p>
        </div>

        <div class="setup-section">
            <div id="ship-dock" class="dock-container"></div>
            <div class="orientation-wrapper">
                <div class="button-group">
                    <button id="btn-horizontal" class="active">Horizontal</button>
                    <button id="btn-vertical">Vertical</button>
                </div>
            </div>
        </div>

        <div class="game-container">
            <div class="board-wrapper p1-area">
                <div class="board-header">
                    <h3 style="margin: 0;">Your Fleet</h3>
                <div style="display: flex; gap: 5px;">
                    <button id="btn-random-p1" class="toggle-btn" style="padding: 5px 10px; font-size: 0.7rem;">🎲 Random</button>
                    <button id="btn-lock-p1" class="toggle-btn" style="padding: 5px 10px; font-size: 0.7rem;">🔒 Lock</button>
                    <button id="toggle-fleet-btn" class="toggle-btn" style="padding: 5px 10px; font-size: 0.7rem;">👁️ Show</button>
                </div>
                </div>
                <div id="player-board" class="board fleet-hidden"></div>
            </div>
    
    <div class="board-wrapper p2-area">
        <div class="board-header">
            <h3 style="margin: 0;">Enemy Fleet</h3>
        <div style="display: flex; gap: 5px;">
            <button id="btn-random-p2" class="toggle-btn" style="display:none; padding: 5px 10px; font-size: 0.7rem;">🎲 Random</button>
            <button id="btn-lock-p2" class="toggle-btn" style="display:none; padding: 5px 10px; font-size: 0.7rem;">🔒 Lock</button>
        </div>
        </div>
        <div id="cpu-board" class="board"></div>
    </div>
    </div>
    </div>
    <div id="game-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Notification</h2>
            <p id="modal-message"></p>
            <button id="modal-btn">Confirm</button>
        </div>
    </div>

    <div id="audio-container" style="display: none;">
        <audio id="sfx-hit" src="./assets/sfx/hit.mp3" preload="auto"></audio>
        <audio id="sfx-miss" src="./assets/sfx/miss.mp3" preload="auto"></audio>
        <audio id="sfx-placingShip" src="./assets/sfx/placingShip.mp3" preload="auto"></audio>
        <audio id="sfx-battlestart" src="./assets/sfx/battlestart.mp3" preload="auto"></audio>
        <audio id="sfx-defeat" src="./assets/sfx/defeat.mp3" preload="auto"></audio>
        <audio id="sfx-victory" src="./assets/sfx/victory.mp3" preload="auto"></audio>
        <audio id="bgm-ocean" src="./assets/sfx/bgm.mp3" preload="auto" loop></audio>
    </div>
    <script type="module" src="./js/game.js"></script>
    <script type="module" src="./js/audio.js"></script>
</body>
</html>
